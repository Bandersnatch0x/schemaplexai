server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: schemaplexai-gateway
  cloud:
    gateway:
      # Routes are defined in GatewayConfig.java (Java DSL with lb:// scheme).
      # YAML route definitions are intentionally omitted to avoid duplicate/conflicting
      # routes. Only Java DSL routes are active.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 10

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

rate-limit:
  enabled: true
  default-limit: 100
  window-size: 60
  whitelist-paths:
    - /auth/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /webjars/**
    - /doc.html

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    root: INFO

management:
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces
      enabled: true
