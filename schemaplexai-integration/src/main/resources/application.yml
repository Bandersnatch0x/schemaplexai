server:
  port: 8088

spring:
  application:
    name: schemaplexai-integration

management:
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces
      enabled: true

logging:
  level:
    com.schemaplexai.integration: info
    root: INFO

integration:
  encryption:
    # AES-256-GCM master secret for tenant-scoped credential encryption.
    # Must be provided via environment variable in production.
    master-secret: ${INTEGRATION_MASTER_SECRET:}
