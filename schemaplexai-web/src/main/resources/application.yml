server:
  port: 8082

spring:
  application:
    name: schemaplexai-web
  flyway:
    enabled: false
  websocket:
    message-buffer-size: 8192

knife4j:
  enable: true
  setting:
    language: zh_cn

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.schemaplexai.web: info
    root: INFO

management:
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces
      enabled: true
