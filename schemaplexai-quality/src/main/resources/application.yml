server:
  port: 8090

spring:
  application:
    name: schemaplexai-quality
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/schemaplexai
    username: ${DB_USERNAME:?required}
    password: ${DB_PASSWORD:?required}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:?required}
    password: ${RABBITMQ_PASSWORD:?required}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 2
        max-concurrency: 10
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.schemaplexai.quality.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

management:
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces
      enabled: true

logging:
  level:
    com.schemaplexai.quality: info
    root: INFO
